name: CI tests

on: [push, pull_request]

jobs:

  # Fast, independent of the build matrix below so a broken build environment
  # never hides a formatting-only failure (or vice versa).
  format-check:
    runs-on: ubuntu-22.04

    steps:

    - uses: actions/checkout@v4

    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install clang-format-14

    - name: Format
      run: source .github/workflows/format-check.sh
      env:
        OS: ${{ runner.os }}
        CLANG_FORMAT: clang-format-14

  # Only the plugins aurora2 ships (see yosys-and-plugins/CMakeLists.txt there),
  # built against the same Yosys it pins. The other plugins in this repo are
  # inherited from upstream F4PGA and don't build against that Yosys.
  Run-tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ql-qlf
          - sdc

    env:
      # Keep in sync with aurora2's yosys-and-plugins/yosys-gh submodule pin.
      YOSYS_VERSION: v0.55
      YOSYS_PREFIX: ${{ github.workspace }}/../yosys-install

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install build-essential bison flex \
          libreadline-dev gawk tcl-dev libffi-dev git graphviz xdot \
          pkg-config python3 libboost-system-dev libboost-python-dev \
          libboost-filesystem-dev zlib1g-dev iverilog

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1

    - name: Restore Yosys
      id: yosys-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.YOSYS_PREFIX }}
        key: yosys-${{ env.YOSYS_VERSION }}-${{ runner.os }}-ubuntu-22.04

    - name: Install Yosys
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        source .github/workflows/setup.sh
      env:
        OS: ${{ runner.os }}

    # Saved before the plugin install below writes into the same prefix.
    - name: Save Yosys
      if: steps.yosys-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.YOSYS_PREFIX }}
        key: yosys-${{ env.YOSYS_VERSION }}-${{ runner.os }}-ubuntu-22.04

    - name: Build and test plugins
      run: |
        export PATH="${YOSYS_PREFIX}/bin:/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        source .github/workflows/build-and-test.sh
      env:
        OS: ${{ runner.os }}
        PLUGIN_NAME: ${{ matrix.plugin }}

  # Single stable check name for branch protection to require: naming each
  # matrix leg directly breaks protection every time the plugin list changes.
  #
  # format-check is deliberately not in `needs` yet: format-check.sh hasn't
  # actually run since it was buried in the always-timed-out Run-tests job
  # (see PR description), and the C++ tree has drifted into inconsistent
  # formatting in the meantime — no clang-format version reproduces it with
  # a clean diff. It still runs so drift is visible, but making it required
  # needs a dedicated repo-wide reformat PR first.
  ci-required:
    name: CI required checks
    runs-on: ubuntu-22.04
    needs: [Run-tests]
    if: always()
    steps:
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.Run-tests.result }}" != "success" ]; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi

  release-tagging:
    name: Version Tagging
    runs-on: ubuntu-22.04
    if: ${{github.event_name == 'push' && github.ref == 'refs/heads/main'}}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
       fetch-depth: 0
       token: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag with Makefile version if not already.
      run: |
        git config --local user.name "Development Bot"
        git config --local user.email "f4pga-dev@chipsalliance.org"

        # We want to tag whenever the version in the Makefile changes.
        # So extract the hash of when the current version was entered.
        read TAG_HASH TAG_VERSION <<<$(git annotate -l Makefile | sed 's/\(^[0-9A-Fa-f]\+\).*PLUGIN_VERSION\s\+=\s\+\([0-9]\+\.[0-9]\+\).*/\1 \2/p;d')

        echo "F4PGA Yosys Plugin Version v${TAG_VERSION} at hash ${TAG_HASH}"

        # If this is the first time we see this tag: apply.
        if [ -z "$(git tag -l "v${TAG_VERSION}")" ]; then
          git tag -a "v${TAG_VERSION}" ${TAG_HASH} -m "Update to v${TAG_VERSION}"
          git push origin "v${TAG_VERSION}"
        else
          echo "Tag already applied"
        fi
